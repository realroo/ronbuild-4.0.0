name: Build plugin
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B clean package
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.0.0
          files: target/RonAutoBuilder-4.0.0.jar
